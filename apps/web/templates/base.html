{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Arko Tech Challenge{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@2"></script>
</head>
<body>
    <div id="app">
      <p>[[ message ]]</p>
    </div>
    <script>
      var app = new Vue({
        el: '#app',
        delimiters: ['[[', ']]'],
        data: {
          message: 'Hello Vue!'
        }
      })
    </script>
  </body>
</html>
