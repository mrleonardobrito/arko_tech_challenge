{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>{% block title %}Arko Tech Challenge{% endblock %}</title> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .tab-btn { position: relative; outline: none; }
      .tab-btn.is-active::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -2px;
        height: 2px;
        background-color: #0d6efd;
        border-radius: 1px;
      }
    </style>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="app">
        <nav class="app-header bg-white border-bottom">
          <div class="container d-flex align-items-center gap-3 py-2">
            <p class="fw-semibold m-0 text-decoration-none" @click="onMenuClick(homeUrl)" focus-visible="false">Arko Tech Challenge</p>
            <div class="ms-auto">
              <nav class="d-flex gap-2 align-items-center justify-content-end">
                <p v-for="item in tabs" :key="item.url" v-text="item.label" @click="onMenuClick(item.url)" class="btn m-0 btn-md tab-btn" :class="{ 'is-active': isActive(item.url) }"></p>
              </nav>
            </div>
          </div>
        </nav>
        <main class="flex-fill container py-3">
          {% block content %}{% endblock %}
        </main>
    </div>
    <script>
      const { createApp, ref } = Vue;

      const config = {
        setup() {
          const homeUrl = '{% url "home" %}';
          const tabs = ref([
            { label: 'Estados', url: '{% url "state_list" %}' },
            { label: 'Cidades', url: '{% url "city_list" %}' },
            { label: 'Distritos', url: '{% url "district_list" %}' },
            { label: 'Empresas', url: '{% url "company_list" %}' }
          ]);

          const currentPath = ref(window.location.pathname);

          const isActive = (url) => {
            try {
              const path = new URL(url, window.location.origin).pathname;
              return currentPath.value === path || currentPath.value.startsWith(path);
            } catch (e) {
              return currentPath.value === url || currentPath.value.startsWith(url);
            }
          }

          const onMenuClick = (url) => {
            window.location.href = url;
          }

          return { homeUrl, tabs, onMenuClick, isActive };
        }
      }

      const app = createApp(config);
      app.mount('#app');
    </script>

    {% block extra_js %}
    {% endblock %}
  </body>
</html>
