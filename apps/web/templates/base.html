{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>{% block title %}Arko Tech Challenge{% endblock %}</title> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .tab-btn { position: relative; outline: none; }
      .tab-btn.is-active::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -2px;
        height: 2px;
        background-color: #0d6efd;
        border-radius: 1px;
      }
    </style>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <div id="app">
        <nav class="app-header bg-white border-bottom">
          <div class="container d-flex align-items-center gap-3 py-2">
            <router-link to="/" class="fw-semibold m-0 text-decoration-none text-dark">Arko Tech Challenge</router-link>
            <div class="ms-auto">
              <nav class="d-flex gap-2 align-items-center justify-content-end">
                <router-link 
                  v-for="item in tabs" 
                  :key="item.path" 
                  :to="item.path" 
                  class="btn m-0 btn-md tab-btn"
                  active-class="is-active"
                  >
                    <span v-text="item.label"></span>
                </router-link>
              </nav>
            </div>
          </div>
        </nav>
        <main class="flex-fill container py-3">
          <router-view></router-view>
        </main>
    </div>
    <script>
      const { createApp, ref } = Vue;
      const { createRouter, createWebHistory } = VueRouter;
    </script>
    
    <script src="{% static 'js/components/Datatable.js' %}"></script>
    
    <script src="{% static 'js/views/HomeView.js' %}"></script>
    <script src="{% static 'js/views/StateView.js' %}"></script>
    <script src="{% static 'js/views/CityView.js' %}"></script>
    <script src="{% static 'js/views/DistrictView.js' %}"></script>
    <script src="{% static 'js/views/CompanyView.js' %}"></script>
    
    <script src="{% static 'js/router.js' %}"></script>
    
    <script src="{% static 'js/app.js' %}"></script>

    {% block extra_js %}
    {% endblock %}
  </body>
</html>
