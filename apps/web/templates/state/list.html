{% extends 'base.html' %}
{% load static %}

{% block title %}Estados - {{ block.super }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col">
        <h2>Estados</h2>
        <div id="state-app">
            <data-table
                fetch-url="/api/states/"
                :server-side="true"
                :page-size="20"
                :columns="columns"
            ></data-table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/Datatable.js' %}"></script>
<script>
    const appStates = Vue.createApp({
        components: { DataTable },
        data() {
            return {
                columns: [
                    { key: 'name', label: 'Nome', sortable: true },
                    { key: 'acronym', label: 'Sigla', sortable: true },
                ],
            };
        },
    });
    appStates.mount('#state-app');
</script>
{% endblock %}
