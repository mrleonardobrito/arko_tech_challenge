{% extends 'base.html' %}
{% load static %}

{% block title %}Cidades - {{ block.super }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col">
        <h2>Cidades</h2>
        <div id="city-app">
            <data-table
                fetch-url="/api/cities/"
                :server-side="true"
                :page-size="20"
                :columns="columns"
            ></data-table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/Datatable.js' %}"></script>
<script>
    const appCities = Vue.createApp({
        components: { DataTable },
        data() {
            return {
                columns: [
                    { key: 'name', label: 'Nome', sortable: true },
                    { key: 'state', displayKey: 'state.name', label: 'Estado', sortable: true },
                ],
            };
        },
    });
    appCities.mount('#city-app');
</script>
{% endblock %}
